include /etc/nginx/modules-enabled/*.conf;   # loads the stream module on Ubuntu/Debian
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log stderr warn;
events { worker_connections 8192; }

# HTTPS: route by SNI without decrypting (no certificates needed)
stream {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    map $ssl_preread_server_name $upstream443 {
        hostnames;
        default 127.0.0.1:9;            # domain not in list -> refused
        include /run/smartdns/allowed_443.map;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream443;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
    }
}

# HTTP: plain reverse proxy by Host header
http {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    access_log off;

    map $host $allowed80 {
        hostnames;
        default 0;
        include /run/smartdns/allowed_80.map;
    }

    server {
        listen 80 default_server;
        client_max_body_size 0;
        if ($allowed80 = 0) { return 444; }
        location / {
            proxy_pass http://$host;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_http_version 1.1;
        }
    }
}
